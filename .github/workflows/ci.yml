name: UI Tests

on:
  workflow_dispatch:
    inputs:
      browserSize:
        description: Browser window size (WIDTHxHEIGHT)
        type: string
        default: 1920x1080
        required: true
      browser:
        description: Browser
        type: choice
        options:
          - chrome
        default: chrome
        required: true

permissions:
  contents: read

jobs:
  ui-tests:
    runs-on: windows-2022
    timeout-minutes: 30
    outputs:
      tests_outcome: ${{ steps.tests.outcome }}
      test_evidence: ${{ steps.evidence.outputs.result }}
    defaults:
      run:
        shell: pwsh
    env:
      UI_BROWSER: ${{ inputs.browser }}
      UI_BROWSER_SIZE: ${{ inputs.browserSize }}
      ALLURE_VERSION: '2.46.1'
      ALLURE_SHA256: d25c519bbde940dc953cff8901130ce18b73013dc19a8f8b90b8b4b1c5eb252f
      SE_SKIP_DRIVER_IN_PATH: 'true'
      SE_AVOID_BROWSER_DOWNLOAD: 'true'
      SE_AVOID_STATS: 'true'

    steps:
      - name: Validate inputs
        run: |
          # Absolute anchors also reject a trailing newline in .NET regexes.
          if ($env:UI_BROWSER_SIZE -cnotmatch '\A[0-9]{3,4}x[0-9]{3,4}\z') {
            throw 'browserSize must match WIDTHxHEIGHT with 3-4 digits per dimension.'
          }
          if ($env:UI_BROWSER -cne 'chrome') {
            throw 'Only Chrome is supported in CI.'
          }

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21 and dependency cache
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-jdk: false
          cache-path: ~/.gradle/caches/modules-2
          cache-dependency-path: |
            build.gradle
            gradle/wrapper/gradle-wrapper.properties
          cache-read-only: ${{ github.ref_name != github.event.repository.default_branch }}

      - name: Install Allure CLI
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $version = $env:ALLURE_VERSION
          $tools = Join-Path $env:GITHUB_WORKSPACE '.tools'
          $archive = Join-Path $tools "allure-commandline-$version.zip"
          $command = Join-Path $tools "allure-$version/bin/allure.bat"
          if (-not $env:JAVA_HOME -or -not (Test-Path -LiteralPath (Join-Path $env:JAVA_HOME 'bin/java.exe'))) {
            throw 'Set JAVA_HOME to an installed JDK before installing Allure.'
          }
          New-Item -ItemType Directory -Path $tools -Force | Out-Null
          if (-not (Test-Path -LiteralPath $archive)) {
            Invoke-WebRequest -UseBasicParsing `
              -Uri "https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/$version/allure-commandline-$version.zip" `
              -OutFile $archive
          }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $env:ALLURE_SHA256) {
            throw 'Allure ZIP SHA-256 mismatch; the archive was not extracted.'
          }
          if (-not (Test-Path -LiteralPath $command)) {
            Expand-Archive -LiteralPath $archive -DestinationPath $tools
          }
          $actualVersion = & $command --version
          if ($LASTEXITCODE -ne 0 -or "$actualVersion".Trim() -ne $version) {
            throw "Expected Allure Report $version, got: $actualVersion"
          }
          Write-Output "Allure Report $actualVersion is ready: $command"
          "ALLURE_COMMAND=$command" >> $env:GITHUB_ENV

      - name: Run UI tests
        id: tests
        timeout-minutes: 10
        run: |
          .\gradlew.bat test --no-daemon --console=plain `
            "-Dselenide.baseUrl=https://github.com" `
            "-Dselenide.browser=$env:UI_BROWSER" `
            "-Dselenide.browserSize=$env:UI_BROWSER_SIZE" `
            "-Dselenide.headless=true"

      # Save raw evidence before generation, independently of the test outcome.
      - name: Upload Allure results and attachments
        if: ${{ !cancelled() && hashFiles('build/allure-results/**') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 3
        with:
          name: allure-results
          path: build/allure-results
          if-no-files-found: error
          retention-days: 7

      - name: Upload JUnit XML and Gradle HTML
        if: ${{ !cancelled() && (hashFiles('build/test-results/test/**') != '' || hashFiles('build/reports/tests/test/**') != '') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 3
        with:
          name: gradle-test-reports
          path: |
            build/test-results/test
            build/reports/tests/test
          if-no-files-found: error
          retention-days: 7

      - name: Generate Allure report
        id: report
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        timeout-minutes: 5
        run: |
          $results = @(Get-ChildItem -Path 'build/allure-results' -Filter '*-result.json' -File -ErrorAction SilentlyContinue)
          if ($results.Count -eq 0) {
            throw 'No Allure test results were produced; report was not generated.'
          }
          & $env:ALLURE_COMMAND generate build/allure-results --clean -o build/allure-report
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path -LiteralPath 'build/allure-report/index.html' -PathType Leaf)) {
            throw 'Allure generation did not produce index.html.'
          }

      - name: Upload generated Allure report
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 3
        with:
          name: allure-report
          path: build/allure-report
          if-no-files-found: error
          retention-days: 7

      - name: Inspect JUnit evidence for notification
        id: evidence
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        run: |
          $evidence = 'invalid'
          try {
            . .\ci\ci-telegram.ps1
            $evidence = Get-UiTestEvidence -ResultsDirectory 'build/test-results/test'
          }
          catch {
            Write-Warning 'JUnit evidence could not be inspected; the test result is unverified.'
          }
          "result=$evidence" >> $env:GITHUB_OUTPUT

  telegram:
    needs: ui-tests
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && (needs.ui-tests.result == 'success' || needs.ui-tests.result == 'failure') }}
    runs-on: windows-2022
    timeout-minutes: 5
    # Only notification infrastructure is best-effort; never the UI tests.
    continue-on-error: true
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check notification configuration
        id: configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          $enabled = -not ([string]::IsNullOrWhiteSpace($env:TELEGRAM_BOT_TOKEN) -or [string]::IsNullOrWhiteSpace($env:TELEGRAM_CHAT_ID))
          "enabled=$($enabled.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $enabled) {
            Write-Warning 'Telegram notification skipped: required Actions secrets are not configured.'
            'Telegram notification: skipped (missing configuration).' >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Checkout notification script
        if: ${{ steps.configuration.outputs.enabled == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Send Telegram notification
        if: ${{ steps.configuration.outputs.enabled == 'true' }}
        timeout-minutes: 1
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UI_JOB_RESULT: ${{ needs.ui-tests.result }}
          UI_TEST_OUTCOME: ${{ needs.ui-tests.outputs.tests_outcome }}
          UI_TEST_EVIDENCE: ${{ needs.ui-tests.outputs.test_evidence }}
        run: |
          $delivery = 'failed'
          try {
            . .\ci\ci-telegram.ps1
            $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            $delivery = Send-CiTelegramNotification -BotToken $env:TELEGRAM_BOT_TOKEN -ChatId $env:TELEGRAM_CHAT_ID `
              -Project $env:GITHUB_REPOSITORY -Branch $env:GITHUB_REF_NAME -JobResult $env:UI_JOB_RESULT `
              -TestOutcome $env:UI_TEST_OUTCOME -TestEvidence $env:UI_TEST_EVIDENCE -RunUrl $runUrl
          }
          catch {
            Write-Warning 'Telegram notification could not run; the UI job result is unchanged.'
          }
          "Telegram notification: $delivery. UI job: $env:UI_JOB_RESULT." >> $env:GITHUB_STEP_SUMMARY
