name: UI Tests

on:
  workflow_dispatch:
    inputs:
      browserSize:
        description: Browser window size (WIDTHxHEIGHT)
        type: string
        default: 1920x1080
        required: true
      browser:
        description: Browser
        type: choice
        options:
          - chrome
        default: chrome
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  ALLURE_VERSION: '2.46.1'
  ALLURE_SHA256: d25c519bbde940dc953cff8901130ce18b73013dc19a8f8b90b8b4b1c5eb252f

jobs:
  ui-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      compile_outcome: ${{ steps.compile.outcome }}
      tests_outcome: ${{ steps.tests.outcome }}
      test_evidence: ${{ steps.evidence.outputs.result }}
      report_generated: ${{ steps.report.outcome == 'success' }}
    env:
      UI_BROWSER: ${{ inputs.browser }}
      UI_BROWSER_SIZE: ${{ inputs.browserSize }}
      SE_SKIP_DRIVER_IN_PATH: 'true'
      SE_AVOID_BROWSER_DOWNLOAD: 'true'
      SE_AVOID_STATS: 'true'

    steps:
      - name: Validate inputs
        shell: pwsh
        run: |
          # Absolute anchors also reject a trailing newline in .NET regexes.
          if ($env:UI_BROWSER_SIZE -cnotmatch '\A[0-9]{3,4}x[0-9]{3,4}\z') {
            throw 'browserSize must match WIDTHxHEIGHT with 3-4 digits per dimension.'
          }
          if ($env:UI_BROWSER -cne 'chrome') {
            throw 'Only Chrome is supported in CI.'
          }

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21 and dependency cache
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-jdk: false
          cache-path: ~/.gradle/caches/modules-2
          cache-dependency-path: |
            build.gradle
            gradle/wrapper/gradle-wrapper.properties
          cache-read-only: ${{ github.ref_name != github.event.repository.default_branch }}

      - name: Allow Chrome sandbox to use user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          if [[ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" != "0" ]]; then
            echo "::error::Unprivileged user namespaces are still restricted"
            exit 1
          fi

      - name: Install Allure CLI
        timeout-minutes: 5
        run: |
          curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 10 --max-time 300 \
            --output "$RUNNER_TEMP/allure.zip" \
            "https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/$ALLURE_VERSION/allure-commandline-$ALLURE_VERSION.zip"
          echo "$ALLURE_SHA256  $RUNNER_TEMP/allure.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/allure.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/allure-$ALLURE_VERSION/bin" >> "$GITHUB_PATH"

      - name: Verify Allure CLI version
        run: |
          actual="$(allure --version)"
          echo "Allure CLI $actual"
          if [[ "$actual" != "$ALLURE_VERSION" ]]; then
            echo "::error::Expected Allure CLI $ALLURE_VERSION"
            exit 1
          fi

      - name: Compile tests
        id: compile
        run: ./gradlew testClasses --no-daemon --console=plain

      - name: Run UI tests
        id: tests
        timeout-minutes: 10
        run: >-
          ./gradlew test --no-daemon --console=plain
          "-Dselenide.baseUrl=https://github.com"
          "-Dselenide.browser=$UI_BROWSER"
          "-Dselenide.browserSize=$UI_BROWSER_SIZE"
          "-Dselenide.headless=true"

      # Save raw evidence before generation, independently of the test outcome.
      - name: Upload Allure results and attachments
        if: ${{ !cancelled() && steps.compile.outcome == 'success' && hashFiles('build/allure-results/**') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 3
        with:
          name: allure-results
          path: build/allure-results
          if-no-files-found: error
          retention-days: 7

      - name: Upload JUnit XML and Gradle HTML
        if: ${{ !cancelled() && steps.compile.outcome == 'success' && (hashFiles('build/test-results/test/**') != '' || hashFiles('build/reports/tests/test/**') != '') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 3
        with:
          name: gradle-test-reports
          path: |
            build/test-results/test
            build/reports/tests/test
          if-no-files-found: error
          retention-days: 7

      - name: Generate Allure report
        id: report
        if: ${{ !cancelled() && steps.compile.outcome == 'success' && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        timeout-minutes: 5
        run: |
          if ! compgen -G "build/allure-results/*-result.json" > /dev/null; then
            echo "::error::No Allure test results were produced; report was not generated."
            exit 1
          fi
          allure generate build/allure-results --clean -o build/allure-report
          if [[ ! -f build/allure-report/index.html ]]; then
            echo "::error::Allure generation did not produce index.html."
            exit 1
          fi

      - name: Upload generated Allure report
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 3
        with:
          name: allure-report
          path: build/allure-report
          if-no-files-found: error
          retention-days: 7

      - name: Upload Pages artifact
        if: ${{ !cancelled() && steps.report.outcome == 'success' && github.ref_name == github.event.repository.default_branch }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/allure-report
          retention-days: 7

      - name: Inspect JUnit evidence for notification
        id: evidence
        shell: pwsh
        if: ${{ !cancelled() && steps.compile.outcome == 'success' && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        run: |
          . ./ci/ci-telegram.ps1
          $evidence = Get-UiTestEvidence -ResultsDirectory 'build/test-results/test'
          "result=$evidence" >> $env:GITHUB_OUTPUT

  notify-telegram:
    needs: ui-tests
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && (needs.ui-tests.result == 'success' || needs.ui-tests.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Only notification infrastructure is best-effort; never the UI tests.
    continue-on-error: true
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check notification configuration
        id: configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          $enabled = -not ([string]::IsNullOrWhiteSpace($env:TELEGRAM_BOT_TOKEN) -or [string]::IsNullOrWhiteSpace($env:TELEGRAM_CHAT_ID))
          "enabled=$($enabled.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $enabled) {
            Write-Warning 'Telegram notification skipped: required Actions secrets are not configured.'
            'Telegram notification: skipped (missing configuration).' >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Checkout notification script
        if: ${{ steps.configuration.outputs.enabled == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Send Telegram notification
        if: ${{ steps.configuration.outputs.enabled == 'true' }}
        timeout-minutes: 1
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UI_JOB_RESULT: ${{ needs.ui-tests.result }}
          UI_TEST_OUTCOME: ${{ needs.ui-tests.outputs.tests_outcome }}
          UI_TEST_EVIDENCE: ${{ needs.ui-tests.outputs.test_evidence }}
        run: |
          $delivery = 'failed'
          try {
            . ./ci/ci-telegram.ps1
            $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            $delivery = Send-CiTelegramNotification -BotToken $env:TELEGRAM_BOT_TOKEN -ChatId $env:TELEGRAM_CHAT_ID `
              -Project $env:GITHUB_REPOSITORY -Branch $env:GITHUB_REF_NAME -JobResult $env:UI_JOB_RESULT `
              -TestOutcome $env:UI_TEST_OUTCOME -TestEvidence $env:UI_TEST_EVIDENCE -RunUrl $runUrl
          }
          catch {
            Write-Warning 'Telegram notification could not run; the UI job result is unchanged.'
          }
          "Telegram notification: $delivery. UI job: $env:UI_JOB_RESULT." >> $env:GITHUB_STEP_SUMMARY

  deploy-report:
    needs: ui-tests
    if: ${{ !cancelled() && needs.ui-tests.outputs.report_generated == 'true' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
